  <text x="27" y="17.5" font-size="11.5" font-weight="600" fill="#93A6C4" letter-spacing="0.3">Innovapptive</text>
  <rect x="140" width="150" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.06" stroke="#27324D"/>
