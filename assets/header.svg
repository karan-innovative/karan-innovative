<svg xmlns="http://www.w3.org/2000/svg" width="916" height="244" viewBox="0 0 916 244" fill="none" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#161F3A"/>
</linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0.4" y2="1">
  <stop offset="0" stop-color="#1A2440"/><stop offset="1" stop-color="#121A2E"/>
</linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#6366F1"/><stop offset="0.55" stop-color="#22D3EE"/><stop offset="1" stop-color="#A855F7"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<radialGradient id="orbA"><stop offset="0" stop-color="#6366F1" stop-opacity="0.55"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
<radialGradient id="orbB"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="190%">
  <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
</filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
  <circle cx="1.4" cy="1.4" r="1.4" fill="#8FA6CC" fill-opacity="0.10"/>
</pattern>
</defs>
<g transform="translate(18,18)">

<clipPath id="hclip"><rect width="880" height="208" rx="22"/></clipPath>
<g clip-path="url(#hclip)">
  <rect width="880" height="208" fill="url(#ink)"/>
  <rect width="880" height="208" fill="url(#dots)"/>
  <g opacity="0.95"><ellipse cx="742" cy="30" rx="210" ry="150" fill="url(#orbA)"/>
  <ellipse cx="868" cy="178" rx="180" ry="130" fill="url(#orbB)"/></g>
  <rect width="880" height="208" fill="url(#sheen)"/>
</g>
<rect x="0.6" y="0.6" width="878.8" height="206.8" rx="21.4" stroke="#27324D"/>
<rect x="44" y="52" width="4" height="104" rx="2" fill="url(#acc)"/>
<text x="68" y="86" font-size="35" font-weight="700" fill="#EAF0FB" letter-spacing="-0.6">Karan Singh Singare</text>
<text x="69" y="118" font-size="16.5" font-weight="600" fill="#22D3EE" letter-spacing="0.2">Mobile Platform Engineer</text>
<text x="69" y="148" font-size="13.5" fill="#93A6C4">Offline-first sync, native storage and the modules React Native stands on.</text>
