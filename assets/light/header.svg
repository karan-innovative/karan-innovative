<svg xmlns="http://www.w3.org/2000/svg" width="880" height="208" viewBox="0 0 880 208" fill="none" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#F7FAFF"/><stop offset="1" stop-color="#DEE9FC"/>
</linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0.4" y2="1">
  <stop offset="0" stop-color="#F5F9FE"/><stop offset="1" stop-color="#FFFFFF"/>
</linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#4F46E5"/><stop offset="0.55" stop-color="#0C87AC"/><stop offset="1" stop-color="#9333EA"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1B2A41" stop-opacity="0.022"/>
  <stop offset="1" stop-color="#1B2A41" stop-opacity="0"/>
</linearGradient>
<radialGradient id="orbA"><stop offset="0" stop-color="#4F46E5" stop-opacity="0.34"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
<radialGradient id="orbB"><stop offset="0" stop-color="#0C87AC" stop-opacity="0.30"/><stop offset="1" stop-color="#0C87AC" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="190%">
  <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B2A41" flood-opacity="0.13"/>
</filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
  <circle cx="1.4" cy="1.4" r="1.4" fill="#2A4066" fill-opacity="0.07"/>
</pattern>
</defs>

<rect width="880" height="208" rx="22" fill="url(#ink)"/>
<rect width="880" height="208" rx="22" fill="url(#dots)"/>
<g opacity="0.95"><ellipse cx="742" cy="30" rx="210" ry="150" fill="url(#orbA)"/>
<ellipse cx="868" cy="178" rx="180" ry="130" fill="url(#orbB)"/></g>
<rect width="880" height="208" rx="22" fill="url(#sheen)"/>
<rect x="0.6" y="0.6" width="878.8" height="206.8" rx="21.4" stroke="#D5DFEF"/>
<rect x="44" y="52" width="4" height="104" rx="2" fill="url(#acc)"/>
<text x="68" y="86" font-size="35" font-weight="700" fill="#0D1626" letter-spacing="-0.6">Karan Singh Singare</text>
<text x="69" y="118" font-size="16.5" font-weight="600" fill="#0C87AC" letter-spacing="0.2">Mobile Platform Engineer</text>
<text x="69" y="148" font-size="13.5" fill="#4D5F7A">Offline-first sync, native storage and the modules React Native stands on.</text>
<g transform="translate(69,164)">
  <rect width="128" height="26" rx="13" fill="#1B2A41" fill-opacity="0.05" stroke="#D5DFEF"/>
  <circle cx="16" cy="13" r="3.2" fill="#0C87AC"/>
  <text x="27" y="17.5" font-size="11.5" font-weight="600" fill="#4D5F7A" letter-spacing="0.3">Innovapptive</text>
  <rect x="140" width="150" height="26" rx="13" fill="#1B2A41" fill-opacity="0.05" stroke="#D5DFEF"/>
  <circle cx="156" cy="13" r="3.2" fill="#9333EA"/>
  <text x="167" y="17.5" font-size="11.5" font-weight="600" fill="#4D5F7A" letter-spacing="0.3">Hyderabad, India</text>
