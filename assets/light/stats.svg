<svg xmlns="http://www.w3.org/2000/svg" width="880" height="124" viewBox="0 0 880 124" fill="none" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#F7FAFF"/><stop offset="1" stop-color="#DEE9FC"/>
</linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0.4" y2="1">
