</linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#4F46E5"/><stop offset="0.55" stop-color="#0C87AC"/><stop offset="1" stop-color="#9333EA"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1B2A41" stop-opacity="0.022"/>
  <stop offset="1" stop-color="#1B2A41" stop-opacity="0"/>
</linearGradient>
<radialGradient id="orbA"><stop offset="0" stop-color="#4F46E5" stop-opacity="0.34"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
<radialGradient id="orbB"><stop offset="0" stop-color="#0C87AC" stop-opacity="0.30"/><stop offset="1" stop-color="#0C87AC" stop-opacity="0"/></radialGradient>
